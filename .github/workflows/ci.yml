name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      STILLDESK_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install local messaging test dependencies
        run: python -m pip install -e integrations/wechat -e integrations/qq pytest
      - name: JavaScript and protocol tests
        run: node scripts/test.mjs
      - name: WeChat fixture tests
        working-directory: integrations/wechat
        run: python -m pytest -q
      - name: QQ fixture tests
        working-directory: integrations/qq
        run: python -m pytest -q
      - name: Private meeting state permissions (no audio capture)
        run: python -m unittest discover -s packages/platforms/tests -p test_private_state.py -v
      - name: Syntax and documentation checks
        run: node scripts/check.mjs
      - name: Public release tree check
        run: node scripts/release-check.mjs
