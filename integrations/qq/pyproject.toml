[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stilldesk-qq"
version = "0.2.0"
description = "Account-scoped local read-only QQNT history and observation tools for AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.25,<2", "cryptography>=43", "psutil>=6", "Pillow>=12,<13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qq-bridge = "qq_bridge.cli:main"
qq-bridge-mcp = "qq_bridge.server:main"

[tool.setuptools.packages.find]
include = ["qq_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
